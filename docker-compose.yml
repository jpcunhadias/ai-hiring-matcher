services:
  api:
    build: .
    container_name: ai-hiring-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DRIFT_SHARE_THRESHOLD=${DRIFT_SHARE_THRESHOLD:-0.5}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: uv run uvicorn src.api:app --host 0.0.0.0 --port 8000

  monitor:
    build: .
    container_name: ai-hiring-monitor
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - DRIFT_SHARE_THRESHOLD=${DRIFT_SHARE_THRESHOLD:-0.5}
    volumes:
      - ./data:/app/data
    command: uv run streamlit run src/monitor_app.py --server.port 8501 --server.address 0.0.0.0
